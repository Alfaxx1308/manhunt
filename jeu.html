<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Man Hunt IRL - Partie</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="shortcut icon" href="./icon.svg">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<section id="game" class="screen on"><div id="top"><div><b id="info"></b></div><div id="status"></div><div id="alert"></div></div><div id="map"></div><div id="bar"><button id="btnSet" hidden>Réglages</button><button id="btnGo" hidden>Lancer</button><button id="btnCaught" hidden class="alt">Capturé</button><button id="btnSos">SOS</button></div></section>
<dialog id="set"><h2>Réglages de la partie</h2><label for="zoneR">Rayon de la zone (mètres)</label><input id="zoneR" type="number" min="100"><label for="headStart">Avance des fugitifs (minutes)</label><input id="headStart" type="number" min="0"><label for="revealSec">Intervalle de révélation (secondes)</label><input id="revealSec" type="number" min="10"><label for="fuzzM">Rayon des cercles flous (mètres)</label><input id="fuzzM" type="number" min="20"><label for="durationMin">Durée de la partie (minutes)</label><input id="durationMin" type="number" min="5"><div class="row" style="margin-top:12px"><button id="btnPick" class="alt">Choisir le centre sur la carte</button><button id="btnHere" class="alt">Centre sur ma position</button></div><div class="row" style="margin-top:8px"><button id="btnSave">Enregistrer</button><button id="btnClose" class="alt">Fermer</button></div></dialog><div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="./common.js"></script>
<script>
let map,zone,me,revIdx=-1;const circles=L.layerGroup(),hm={};S.code=(new URLSearchParams(location.search).get('code')||'').toUpperCase();function initMap(){if(map)return;map=L.map('map',{zoomControl:false}).setView([S.rules.lat,S.rules.lng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);zone=L.circle([S.rules.lat,S.rules.lng],{radius:S.rules.zoneR,color:'#ff6a00',fill:false,weight:3,dashArray:'10 8'}).addTo(map);circles.addTo(map)}const setRules=p=>db.ref('games/'+S.code+'/rules').update(p);async function start(){if(!S.code||!S.name){location.href='index.html';return}const snap=await db.ref('games/'+S.code).get();if(!snap.exists()){alert('Partie introuvable');location.href='index.html';return}S.host=snap.val().host===S.id;S.role=localStorage.mhRole||'fugitif';S.joined=now();S.rules={...DEF,...snap.val().rules};await db.ref(`games/${S.code}/players/${S.id}`).update({name:S.name,role:S.role,caught:false});initMap();ui()}function ui(){$('#info').textContent='Partie '+S.code+' ('+S.role+')';$('#btnSet').hidden=$('#btnGo').hidden=!S.host;$('#btnGo').textContent=S.status==='running'?'Terminer':'Lancer';$('#btnCaught').hidden=S.role!=='fugitif'}start();
</script>
</body>
</html>
