<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Man Hunt IRL</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--bg:#0b0b0c;--panel:#16161a;--line:#2a2a31;--tx:#f5f5f6;--mut:#9a9aa5;--or:#ff6a00;--or2:#ff8a3d;--bad:#e5173f}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
    .screen{display:none;height:100%}.screen.on{display:flex;flex-direction:column}
    #home{padding:max(28px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));gap:12px;justify-content:flex-end;background:radial-gradient(120% 60% at 90% 0%,rgba(255,106,0,.32),transparent 65%),var(--bg)}
    h1{font:800 3.8rem/.95 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.04em;margin:0}
    .pill{display:inline-block;background:var(--or);color:#000;font-weight:800;border-radius:999px;padding:2px 16px;font-size:1.3rem;letter-spacing:0;vertical-align:middle}
    .tag{color:var(--mut);margin:0 0 16px;max-width:32ch}
    input,select,button{font:inherit;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--tx);width:100%}
    input::placeholder{color:var(--mut)}
    button{background:var(--or);border-color:var(--or);color:#000;font-weight:700;cursor:pointer;transition:transform .1s}
    button:active{transform:scale(.97)}button:disabled{opacity:.6;cursor:wait}
    button.alt{background:var(--panel);border-color:var(--line);color:var(--tx)}
    .row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
    :focus-visible{outline:2px solid var(--or2);outline-offset:2px}
    #game{position:relative;min-height:0}#map{flex:1;min-height:0;background:var(--bg)}
    #top{position:absolute;z-index:1000;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;padding:12px 14px;background:rgba(11,11,12,.82);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;pointer-events:auto}
    #top b{color:var(--or)}#status{font-size:.95rem}#alert{display:none;background:var(--bad);color:#fff;padding:8px 10px;margin-top:8px;border-radius:10px;font-weight:700}
    #bar{display:flex;gap:8px;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}#bar button[hidden]{display:none}
    #btnSos{background:var(--bad);border-color:var(--bad);color:#fff;flex:0 0 84px}
    dialog{border:1px solid var(--line);border-radius:22px;padding:20px;width:min(92vw,420px);background:var(--panel);color:var(--tx)}dialog::backdrop{background:rgba(0,0,0,.7)}
    dialog h2{margin:0 0 4px}dialog label{display:block;margin:12px 0 6px;color:var(--mut);font-size:.9rem}
    #toast{position:fixed;z-index:3000;left:50%;bottom:96px;transform:translateX(-50%);background:var(--or);color:#000;font-weight:700;padding:10px 18px;border-radius:999px;display:none;max-width:90vw}
    .leaflet-container{background:#0b0b0c}.leaflet-control-attribution{background:rgba(0,0,0,.6)!important;color:#9a9aa5!important}.leaflet-control-attribution a{color:#ff8a3d!important}
  </style>
</head>
<body>
  <section id="home" class="screen on">
    <h1>Man<br>Hunt <span class="pill">IRL</span></h1>
    <p class="tag">Poursuite grandeur nature. Crée une partie, invite tes amis, traque ou disparais.</p>
    <input id="name" placeholder="Ton pseudo" autocomplete="nickname" maxlength="30">
    <select id="role"><option value="fugitif">Je suis fugitif</option><option value="chasseur">Je suis chasseur</option></select>
    <button id="btnCreate">Créer une partie</button>
    <div class="row"><input id="code" placeholder="Code" maxlength="4" autocapitalize="characters"><button id="btnJoin" class="alt">Rejoindre</button></div>
  </section>

  <section id="game" class="screen">
    <div id="top"><div><b id="info"></b></div><div id="status"></div><div id="alert"></div></div>
    <div id="map"></div>
    <div id="bar"><button id="btnSet" hidden>Réglages</button><button id="btnGo" hidden>Lancer</button><button id="btnCaught" hidden class="alt">Capturé</button><button id="btnSos">SOS</button></div>
  </section>

  <dialog id="set">
    <h2>Réglages de la partie</h2>
    <label for="zoneR">Rayon de la zone (mètres)</label><input id="zoneR" type="number" min="100">
    <label for="headStart">Avance des fugitifs (minutes)</label><input id="headStart" type="number" min="0">
    <label for="revealSec">Intervalle de révélation (secondes)</label><input id="revealSec" type="number" min="10">
    <label for="fuzzM">Rayon des cercles flous (mètres)</label><input id="fuzzM" type="number" min="20">
    <label for="durationMin">Durée de la partie (minutes)</label><input id="durationMin" type="number" min="5">
    <div class="row" style="margin-top:12px"><button id="btnPick" class="alt">Choisir le centre sur la carte</button><button id="btnHere" class="alt">Centre sur ma position</button></div>
    <div class="row" style="margin-top:8px"><button id="btnSave">Enregistrer</button><button id="btnClose" class="alt">Fermer</button></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // Configuration du projet Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBs1dxrsJKjYZQwk9s-6A5JUMAgUz2Umc8",
      authDomain: "manhunt-42850.firebaseapp.com",
      projectId: "manhunt-42850",
      storageBucket: "manhunt-42850.firebasestorage.app",
      messagingSenderId: "721791132248",
      appId: "1:721791132248:web:a7dd7fbaf9deadddf9e02d",
      measurementId: "G-VHSC50F5ZM"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const $ = selector => document.querySelector(selector);
    const DEF = {lat:48.8566,lng:2.3522,zoneR:1000,headStart:5,revealSec:150,fuzzM:150,durationMin:60};
    const S = {
      id: localStorage.mhId || (localStorage.mhId = Math.random().toString(36).slice(2,10)),
      name:'',code:null,role:null,host:false,rules:{...DEF},status:'lobby',startedAt:0,
      players:{},pos:null,pick:false,out:false,drawn:-1,last:0,centered:false
    };
    let offset=0,map=null,zone=null,me=null,revIdx=-1,tickTimer=null,watchId=null;
    const circles=L.layerGroup(), hunterMarkers={};

    db.ref('.info/serverTimeOffset').on('value', snapshot => { offset=snapshot.val() || 0; });
    const now=() => Date.now()+offset;
    const fmt=ms => {const seconds=Math.max(0,Math.ceil(ms/1000));return Math.floor(seconds/60)+' min '+String(seconds%60).padStart(2,'0')+' s';};
    const toast=message => {const el=$('#toast');el.textContent=message;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>{el.style.display='none';},3500);};
    const show=id => {document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('on',el.id===id));};
    const distance=(a,b)=>{const radius=6371000,rad=Math.PI/180,lat=(b.lat-a.lat)*rad,lng=(b.lng-a.lng)*rad;const h=Math.sin(lat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(lng/2)**2;return 2*radius*Math.asin(Math.sqrt(h));};
    const getPos=()=>new Promise((resolve,reject)=>{
      if(!navigator.geolocation)return reject(new Error('La géolocalisation n’est pas disponible sur cet appareil.'));
      navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude}),reject,{enableHighAccuracy:true,timeout:8000});
    });
    function notify(title,body){
      if(window.Notification&&Notification.permission==='granted'&&navigator.serviceWorker){navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,{body,icon:'icon.svg',vibrate:[200,100,200]})).catch(()=>{});}
      if(navigator.vibrate)navigator.vibrate([200,100,200]);
    }
    function alertBar(message,vibrate=false){const alert=$('#alert');alert.textContent=message;alert.style.display='block';alert.onclick=()=>{alert.style.display='none';};if(vibrate)notify('Man Hunt',message);}
    function initMap(){
      if(map)return;
      map=L.map('map',{zoomControl:false}).setView([S.rules.lat,S.rules.lng],15);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'}).addTo(map);
      zone=L.circle([S.rules.lat,S.rules.lng],{radius:S.rules.zoneR,color:'#ff6a00',fill:false,weight:3,dashArray:'10 8'}).addTo(map);
      circles.addTo(map);
      map.on('click',event=>{if(S.pick){S.pick=false;setRules({lat:event.latlng.lat,lng:event.latlng.lng});toast('Centre de la zone déplacé');}});
      setTimeout(()=>map.invalidateSize(),100);
    }
    const setRules=values=>db.ref('games/'+S.code+'/rules').update(values).catch(error=>toast('Erreur Firebase : '+error.message));

    async function enter(code,name,role,host){
      Object.assign(S,{code,name,role,host,joined:now(),centered:false});
      localStorage.mhName=name;
      if(window.Notification&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});
      await db.ref(`games/${code}/players/${S.id}`).update({name,role,caught:false});
      show('game');initMap();setTimeout(()=>map.invalidateSize(),100);listen();watch();wake();ui();
    }
    $('#name').value=localStorage.mhName||'';
    $('#btnCreate').addEventListener('click',async()=>{
      const button=$('#btnCreate'),name=$('#name').value.trim();
      if(!name)return toast('Entre un pseudo');
      button.disabled=true;
      try{
        const code=Array.from({length:4},()=> 'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.random()*23|0]).join('');
        const rules={...DEF};
        try{const position=await getPos();rules.lat=position.lat;rules.lng=position.lng;}catch(_){toast('Position indisponible : centre défini sur Paris.');}
        S.rules=rules;
        await db.ref('games/'+code).set({host:S.id,status:'lobby',rules});
        await enter(code,name,$('#role').value,true);
      }catch(error){console.error(error);toast('Impossible de créer la partie : '+(error.message||'erreur inconnue'));}
      finally{button.disabled=false;}
    });
    $('#btnJoin').addEventListener('click',async()=>{
      const button=$('#btnJoin'),name=$('#name').value.trim(),code=$('#code').value.trim().toUpperCase();
      if(!name||!code)return toast('Pseudo et code requis');
      button.disabled=true;
      try{const snapshot=await db.ref('games/'+code).get();if(!snapshot.exists())return toast('Aucune partie avec ce code');await enter(code,name,$('#role').value,snapshot.val().host===S.id);}
      catch(error){console.error(error);toast('Impossible de rejoindre : '+(error.message||'erreur inconnue'));}
      finally{button.disabled=false;}
    });

    function listen(){
      const game=db.ref('games/'+S.code);
      game.child('rules').on('value',snapshot=>{
        S.rules={...DEF,...(snapshot.val()||{})};const rules=S.rules;
        if(zone)zone.setLatLng([rules.lat,rules.lng]).setRadius(rules.zoneR);
        if(map&&!S.centered){map.setView([rules.lat,rules.lng],15);S.centered=true;}
      },error=>toast('Lecture des réglages impossible : '+error.message));
      game.child('status').on('value',snapshot=>{S.status=snapshot.val()||'lobby';ui();});
      game.child('startedAt').on('value',snapshot=>{S.startedAt=snapshot.val()||0;revIdx=-1;S.drawn=-1;circles.clearLayers();});
      game.child('sos').on('value',snapshot=>{const value=snapshot.val();if(value&&value.t>S.joined)alertBar('SOS de '+value.name,true);});
      if(S.role==='chasseur')game.child('players').on('value',snapshot=>{S.players=snapshot.val()||{};drawHunters();if(revIdx>=0&&S.drawn!==revIdx)reveal(revIdx);});
      clearInterval(tickTimer);tickTimer=setInterval(tick,1000);tick();
    }
    function watch(){
      if(!navigator.geolocation){toast('La géolocalisation n’est pas disponible.');return;}
      if(watchId!==null)navigator.geolocation.clearWatch(watchId);
      watchId=navigator.geolocation.watchPosition(position=>{
        const point={lat:position.coords.latitude,lng:position.coords.longitude};S.pos=point;
        me=me?me.setLatLng(point):L.circleMarker(point,{radius:9,color:'#ff6a00',fillColor:'#fff',fillOpacity:1,weight:4}).addTo(map);
        const timestamp=now();if(timestamp-(S.last||0)>4000){S.last=timestamp;db.ref(`games/${S.code}/players/${S.id}/pos`).set({...point,t:timestamp}).catch(error=>toast('Envoi GPS impossible : '+error.message));}
        const outside=distance(point,S.rules)>S.rules.zoneR;
        if(outside!==S.out){S.out=outside;if(outside){alertBar('Tu es hors de la zone de jeu',true);}else $('#alert').style.display='none';}
      },error=>toast('GPS : '+error.message),{enableHighAccuracy:true,maximumAge:2000});
    }
    async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen');}catch(_){}}
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.code)wake();});

    function drawHunters(){
      for(const [id,player] of Object.entries(S.players)){
        if(id===S.id||player.role!=='chasseur'||!player.pos)continue;
        if(!hunterMarkers[id])hunterMarkers[id]=L.circleMarker([player.pos.lat,player.pos.lng],{radius:6,color:'#0b0b0c',fillColor:'#fff',fillOpacity:1,weight:2}).bindTooltip(player.name||'Chasseur').addTo(map);
        else hunterMarkers[id].setLatLng([player.pos.lat,player.pos.lng]);
      }
    }
    function randomGenerator(text){let h=1779033703^text.length;for(let i=0;i<text.length;i++){h=Math.imul(h^text.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296;};}
    function reveal(index){
      circles.clearLayers();let count=0;const fuzz=S.rules.fuzzM;
      for(const [id,player] of Object.entries(S.players)){
        if(player.role!=='fugitif'||player.caught||!player.pos)continue;
        count++;const random=randomGenerator(id+index),angle=random()*Math.PI*2,offsetMeters=random()*fuzz*.7;
        const lat=player.pos.lat+offsetMeters*Math.cos(angle)/111320;
        const lng=player.pos.lng+offsetMeters*Math.sin(angle)/(111320*Math.cos(player.pos.lat*Math.PI/180));
        L.circle([lat,lng],{radius:fuzz,color:'#ff6a00',weight:2,fillColor:'#ff6a00',fillOpacity:.25}).addTo(circles);
      }
      if(count){S.drawn=index;notify('Radar','Nouvelles positions des fugitifs');}
    }
    function tick(){
      const rules=S.rules,time=now();let message='';
      if(S.status==='lobby')message='En attente du lancement';
      else if(S.status==='ended')message='Partie terminée';
      else{
        const start=S.startedAt+rules.headStart*60000,end=S.startedAt+rules.durationMin*60000;
        if(time>end)message='Temps écoulé';
        else if(time<start)message=(S.role==='fugitif'?'Cache-toi, départ des chasseurs dans ':'Les fugitifs se cachent, départ dans ')+fmt(start-time);
        else{const index=Math.floor((time-start)/(rules.revealSec*1000));message='Fin de partie dans '+fmt(end-time);if(S.role==='chasseur'){message='Prochaine position dans '+fmt(start+(index+1)*rules.revealSec*1000-time)+'. '+message;if(index!==revIdx){revIdx=index;reveal(index);}}}
      }
      $('#status').textContent=message;
    }
    function ui(){
      $('#info').textContent='Partie '+S.code+' ('+S.role+')';
      $('#btnSet').hidden=$('#btnGo').hidden=!S.host;
      $('#btnGo').textContent=S.status==='running'?'Terminer':'Lancer';
      $('#btnCaught').hidden=S.role!=='fugitif';
    }
    $('#btnGo').addEventListener('click',()=>db.ref('games/'+S.code).update(S.status==='running'?{status:'ended'}:{status:'running',startedAt:firebase.database.ServerValue.TIMESTAMP}).catch(error=>toast('Action impossible : '+error.message)));
    $('#btnCaught').addEventListener('click',()=>{if(confirm('Confirmer que tu as été capturé ?'))db.ref(`games/${S.code}/players/${S.id}/caught`).set(true).catch(error=>toast('Action impossible : '+error.message));});
    $('#btnSos').addEventListener('click',()=>{if(confirm('Envoyer une alerte SOS à tous les joueurs ?'))db.ref(`games/${S.code}/sos`).set({name:S.name,t:now()}).catch(error=>toast('Envoi du SOS impossible : '+error.message));});
    $('#btnSet').addEventListener('click',()=>{for(const key of ['zoneR','headStart','revealSec','fuzzM','durationMin'])$('#'+key).value=S.rules[key];$('#set').showModal();});
    $('#btnClose').addEventListener('click',()=>$('#set').close());
    $('#btnSave').addEventListener('click',()=>{
      const values={};for(const key of ['zoneR','headStart','revealSec','fuzzM','durationMin'])values[key]=Number($('#'+key).value);
      if(!Number.isFinite(values.zoneR)||values.zoneR<100||!Number.isFinite(values.headStart)||values.headStart<0||!Number.isFinite(values.revealSec)||values.revealSec<10||!Number.isFinite(values.fuzzM)||values.fuzzM<20||!Number.isFinite(values.durationMin)||values.durationMin<5)return toast('Vérifie les valeurs des réglages');
      setRules(values);$('#set').close();toast('Réglages enregistrés');
    });
    $('#btnPick').addEventListener('click',()=>{S.pick=true;$('#set').close();toast('Touche la carte pour placer le centre');});
    $('#btnHere').addEventListener('click',async()=>{const position=S.pos||await getPos().catch(()=>null);if(position){setRules(position);toast('Centre déplacé sur ta position');}else toast('Position GPS indisponible');});
    if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(error=>console.warn('Service worker non enregistré :',error));
  </script>
</body>
</html>
