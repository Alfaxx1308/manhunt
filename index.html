<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Man Hunt IRL</title>
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root{color-scheme:dark;--bg:#0b0b0c;--panel:#16161a;--line:#2a2a31;--text:#f5f5f6;--muted:#9a9aa5;--orange:#ff6a00;--red:#e5173f}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:flex;align-items:flex-end;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));background:radial-gradient(120% 60% at 90% 0%,rgba(255,106,0,.32),transparent 65%),var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    main{width:min(100%,480px);display:grid;gap:12px}h1{font-size:clamp(3.2rem,15vw,4.2rem);line-height:.95;letter-spacing:-.04em;margin:0;font-weight:800}.pill{display:inline-block;background:var(--orange);color:#000;border-radius:999px;padding:3px 14px;font-size:1.2rem;vertical-align:middle;letter-spacing:0}.tag{color:var(--muted);max-width:34ch;margin:0 0 12px}
    input,select,button{width:100%;min-height:52px;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);font:inherit}input::placeholder{color:var(--muted)}button{background:var(--orange);border-color:var(--orange);color:#000;font-weight:750;cursor:pointer}button.alt{background:var(--panel);border-color:var(--line);color:var(--text)}.row{display:flex;gap:8px}.row>*{min-width:0;flex:1}#message{min-height:1.4em;margin:0;color:#ff8a3d}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ff8a3d;outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <h1>Man<br>Hunt <span class="pill">IRL</span></h1>
    <p class="tag">Poursuite grandeur nature. Crée une partie, invite tes amis, traque ou disparais.</p>
    <input id="name" placeholder="Ton pseudo" autocomplete="nickname" maxlength="30" aria-label="Ton pseudo">
    <select id="role" aria-label="Ton rôle"><option value="fugitif">Je suis fugitif</option><option value="chasseur">Je suis chasseur</option></select>
    <button id="create">Créer une partie</button>
    <div class="row"><input id="code" placeholder="Code de la partie" maxlength="4" autocapitalize="characters" aria-label="Code de la partie"><button id="join" class="alt">Rejoindre</button></div>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script>
    const $=selector=>document.querySelector(selector);
    $('#name').value=localStorage.getItem('mhName')||'';
    $('#role').value=localStorage.getItem('mhRole')||'fugitif';
    function savePlayer(){
      const name=$('#name').value.trim();
      if(!name){$('#message').textContent='Entre un pseudo pour continuer.';$('#name').focus();return false;}
      localStorage.setItem('mhName',name);
      localStorage.setItem('mhRole',$('#role').value);
      $('#message').textContent='';
      return true;
    }
    $('#create').addEventListener('click',()=>{if(savePlayer())location.href='./creer.html';});
    $('#join').addEventListener('click',()=>{
      if(!savePlayer())return;
      const code=$('#code').value.trim().toUpperCase();
      if(!code){$('#message').textContent='Entre le code de la partie.';$('#code').focus();return;}
      location.href='./jeu.html?code='+encodeURIComponent(code);
    });
    $('#code').addEventListener('keydown',event=>{if(event.key==='Enter')$('#join').click();});
    if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(error=>console.warn('Service worker non enregistré:',error));
  </script>
</body>
</html>
